<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes da Kureha</title>
    <link rel="icon" href="Img/coliButton.png">
    <link rel="stylesheet" href="kureha.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <div class="background">
        <div class="main">
            <div class="rot-bt">
                <span class="material-symbols-outlined">
                    arrow_back
                </span>
            </div>
            <div class="topbar">
                <div class="bed bed-one"></div>
                <div class="bed bed-two"></div>
                <div class="bed bed-three"></div>
                <div class="bed bed-four"></div>
                <div class="bed bed-five"></div>
                <div class="bed bed-six"></div>
                <div class="bed bed-seven"></div>
            </div>
            <div class="bottombar">
                <div class="crafting-tables">
                    <div class="crafting-table Armario">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Cabinet.png" alt="">
                            <p>Armário</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Prateleira">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Cupboard.png" alt="">
                            <p>Prateleira</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Geladeira">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Fridge.png" alt="">
                            <p>Geladeira</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Cortador">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Cutter.png" alt="">
                            <p>Cortador</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Fogao">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Stove.png" alt="">
                            <p>Fogão</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Toalhas">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Towels.png" alt="">
                            <p>Toalhas</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Pilao">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Pestle.png" alt="">
                            <p>Pilão</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Mangas">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Manga.png" alt="">
                            <p>Mangás</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Remedios">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Pills.png" alt="">
                            <p>Remédios</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Livros">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Books.png" alt="">
                            <p>Livros</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Deposito">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Warehouse.png" alt="">
                            <p>Depósito</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                    <div class="crafting-table Vpx">
                        <div class="crafting-table-info">
                            <img src="Img/Kureha/Craft/Robot.png" alt="">
                            <p>Vpx Quebrado</p>
                        </div>
                        <div class="crafting-table-items">

                        </div>
                    </div>
                </div>
            </div>
            <div class="patient-selector-bg">
                <div class="patient-selector">
                    <div class="patient-select-close"></div>
                    <input class="patient-selector-search" placeholder="Pesquisar Paciente..." type="text">

                    </input>
                    <div class="patient-list"></div>
                </div>
            </div>
                <div class="chest-map">
              <img src="" alt="Map Image" class="map-img" />
              <img
                src="Img/closeButton2.png"
                alt="Close"
                class="map-close-bt"
              />
              <div class="map-options">
                <div class="map-updown map-up">
                  <span class="material-symbols-outlined"
                    >keyboard_arrow_up</span
                  >
                </div>
                <div class="map-updown map-down">
                  <span class="material-symbols-outlined"
                    >keyboard_arrow_down</span
                  >
                </div>
              </div>
              <div class="map-coordinates"></div>
            </div>
        </div>
    </div>
    <div class="assinatura">
        <p>Criado por Lionheart</p>
    </div>
</body>
<script src="constants.js"></script>
<script src="kureha.js"></script>
<style>
    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        color: white;
    }
</style>

</html>
